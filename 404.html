<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0E3386">
<title>Wine Detention</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600;700&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cubs-blue:#0E3386;
    --cubs-blue-deep:#0A2768;
    --cubs-blue-ink:#163F99;
    --cubs-red:#CC3433;
    --cubs-red-dark:#A51E24;
    --ivory:#FFFFFF;
    --ivory-deep:#F3F6FF;
    --manila:#FFFFFF;
    --manila-dark:#E8EEF9;
    --ink:#0E3386;
    --gold:#CC3433;
    --lime:#FFFFFF;
    --siren:#CC3433;
    --font-chalk:'Caveat',cursive;
    --font-type:'IBM Plex Mono',monospace;
    --font-body:'IBM Plex Sans',sans-serif;
    --font-bang:'Anton',sans-serif;
    --rail-w:64px;
    --luxe-gold:#C9A962;
    --luxe-ivory:#F6F1E6;
    --luxe-ink:#0E3386;
  }

  [data-theme="light"]{
    --chrome:#0E3386;
    --chrome-deep:#0A2768;
    --chrome-text:#FFFFFF;
    --chrome-muted:#D6E4FF;
    --page:#FFFFFF;
    --page-text:#0E3386;
    --page-muted:#3D5A99;
    --card:#FFFFFF;
    --card-border:#C9D6F2;
    --line:rgba(14,51,134,0.16);
    --accent:var(--cubs-red);
    --accent-soft:#E36A68;
    --accent-ink:#FFFFFF;
    --why-bg:#0E3386;
    --why-text:#FFFFFF;
    --why-muted:#D6E4FF;
    --gate-overlay:rgba(14,51,134,0.88);
    --header-border:rgba(255,255,255,0.22);
    --hero-sub:#163F99;
    --surface:#FFFFFF;
    --rule:#D7E0F4;
    --pinstripe:rgba(14,51,134,0.08);
    --ink-on-accent:#FFFFFF;
  }

  [data-theme="dark"]{
    --chrome:#0E3386;
    --chrome-deep:#0A2768;
    --chrome-text:#FFFFFF;
    --chrome-muted:#D6E4FF;
    --page:#163F99;
    --page-text:#FFFFFF;
    --page-muted:#D6E4FF;
    --card:#0E3386;
    --card-border:#5B7CC8;
    --line:rgba(255,255,255,0.22);
    --accent:var(--cubs-red);
    --accent-soft:#E36A68;
    --accent-ink:#FFFFFF;
    --why-bg:#0A2768;
    --why-text:#FFFFFF;
    --why-muted:#D6E4FF;
    --gate-overlay:rgba(10,39,104,0.92);
    --header-border:rgba(255,255,255,0.22);
    --hero-sub:#D6E4FF;
    --surface:#0E3386;
    --rule:#5B7CC8;
    --pinstripe:rgba(255,255,255,0.12);
    --ink-on-accent:#FFFFFF;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;overflow-x:hidden;-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    font-family:var(--font-body);
    color:var(--page-text);
    background-color:var(--page);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    max-width:100%;
  }
  img,svg{display:block;max-width:100%;}
  a{color:inherit;text-decoration:none;}
  button,a,input,select,textarea{font-family:inherit;touch-action:manipulation;}
  button{cursor:pointer;}
  h1,h2,h3,h4{margin:0;font-weight:600;}
  p{margin:0;}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px;}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

  #age-gate{
    position:fixed;inset:0;background:var(--gate-overlay);
    display:flex;align-items:center;justify-content:center;
    z-index:200;padding:20px;
  }
  #age-gate.hidden{display:none;}
  .gate-card{
    background:#FFFFFF;
    border:1px solid #D7E0F4;
    border-radius:16px;
    max-width:380px;width:100%;
    padding:28px 24px 22px;
    text-align:center;
    color:var(--cubs-blue);
    box-shadow:0 24px 60px rgba(14,51,134,.18);
  }
  .gate-card h2{font-family:var(--font-bang);font-size:28px;color:#0E3386;line-height:1.05;text-transform:uppercase;}
  .gate-card p{margin-top:8px;font-size:13px;color:#3D5A99;}
  .gate-card::before{
    content:attr(data-pass);
    font-family:var(--font-type);
    font-size:11px;letter-spacing:1.5px;
    color:var(--cubs-red);
    display:block;margin-bottom:10px;
  }
  .gate-actions{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
  .gate-actions .btn{min-height:48px;}
  .btn{
    font-family:var(--font-body);
    font-size:14px;
    font-weight:600;
    padding:12px 18px;
    border:1px solid transparent;
    border-radius:8px;
    background:var(--page);
    color:var(--page-text);
    transition:background .15s ease, box-shadow .15s ease, filter .15s ease;
    flex:1;
  }
  .btn:hover{filter:brightness(1.03);}
  .btn-primary{
    background:var(--cubs-red);border-color:var(--cubs-red);color:#fff;
  }
  .btn-primary:hover{background:var(--cubs-red-dark);}
  .btn-dark{background:var(--cubs-blue);border-color:var(--cubs-blue);color:#fff;}
  .btn-dark:hover{filter:brightness(1.08);}
  .btn-ghost{
    background:transparent;border-color:var(--line);color:var(--chrome-text);
    padding:8px 10px;flex:none;min-width:42px;
  }
  [data-theme="light"] .btn-ghost{border-color:var(--header-border);}
  .btn-block{width:100%;}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none;}

  .ticker{
    background:var(--cubs-red);color:#fff;
    overflow:hidden;white-space:nowrap;
    font-family:var(--font-type);font-size:12px;font-weight:700;
    letter-spacing:.04em;
    border-bottom:3px solid #fff;
  }
  .ticker-track{
    display:inline-flex;gap:48px;padding:8px 0;
    animation:ticker 28s linear infinite;
  }
  .ticker b{color:#fff;}
  @keyframes ticker{from{transform:translateX(0);}to{transform:translateX(-50%);}}

  header.site{
    background:var(--chrome);
    color:var(--chrome-text);
    position:sticky;top:0;z-index:100;
    border-bottom:1px solid var(--header-border);
  }
  .urgency{
    display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;
    background:var(--cubs-red);color:#fff;
    padding:8px 16px;
    font-family:var(--font-type);font-size:12px;font-weight:700;
    letter-spacing:.06em;
  }
  .live-dot{
    display:inline-flex;align-items:center;gap:6px;
    background:#fff;color:var(--cubs-blue);
    padding:3px 8px;
  }
  .live-dot::before{
    content:"";width:7px;height:7px;border-radius:50%;background:var(--cubs-red);
    box-shadow:0 0 0 0 rgba(204,52,51,0.7);
    animation:liveblink 1.1s infinite;
  }
  @keyframes liveblink{
    0%{box-shadow:0 0 0 0 rgba(204,52,51,0.7);}
    70%{box-shadow:0 0 0 8px rgba(204,52,51,0);}
    100%{box-shadow:0 0 0 0 rgba(204,52,51,0);}
  }
  .clock{
    font-family:var(--font-bang);font-size:20px;letter-spacing:.08em;
    color:var(--cubs-blue);background:#fff;padding:2px 10px;
  }
  .nav-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 24px;max-width:1120px;margin:0 auto;
    gap:12px;
  }
  .brand{
    font-family:var(--font-chalk);
    font-size:28px;
    color:#fff;
    display:flex;align-items:center;gap:10px;
    white-space:nowrap;
  }
  .brand-mark{
    width:52px;height:52px;flex-shrink:0;
    filter:drop-shadow(2px 2px 0 var(--cubs-red));
  }
  .brand-mark .cork{animation:corkPop 1.5s ease-in-out infinite;}
  .brand-mark .spray{animation:sprayPop 1.2s ease-in-out infinite;}
  @keyframes corkPop{
    0%,15%{transform:translate(0,0);}
    45%{transform:translate(5px,-12px) rotate(12deg);}
    100%{transform:translate(8px,-6px) rotate(8deg);}
  }
  @keyframes sprayPop{
    0%,100%{opacity:.45;transform:translateY(0);}
    50%{opacity:1;transform:translateY(-5px);}
  }
  .brand-type{display:flex;flex-direction:column;line-height:.9;}
  .brand-kicker{
    font-family:var(--font-type);font-size:9px;letter-spacing:.16em;
    color:#fff;opacity:.85;margin-bottom:3px;
  }
  nav.links a:hover, nav.links a.active{opacity:1;border-color:#fff;}
  .cart-link{
    display:flex;align-items:center;gap:6px;
    font-family:var(--font-type);
    background:#fff;color:var(--cubs-blue);border:2px solid #fff;
    padding:8px 12px;
    font-size:13px;font-weight:700;
  }
  [data-theme="light"] .cart-link{border-color:#fff;}
  .cart-count{
    background:var(--cubs-red);color:#fff;
    border-radius:50%;min-width:18px;height:18px;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:11px;padding:0 4px;
  }
  nav.links{display:flex;gap:18px;align-items:center;flex-wrap:nowrap;}
  nav.links a{
    font-size:14px;font-weight:600;
    color:var(--chrome-text);opacity:.85;
    padding:4px 2px;border-bottom:2px solid transparent;
    transition:opacity .15s, border-color .15s;
  }
  nav.links a:hover, nav.links a.active{opacity:1;border-color:#fff;}
  .chrome-tools{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .lang-select{
    font-family:var(--font-type);
    font-size:12px;
    padding:7px 8px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--chrome-text);
    max-width:128px;
  }
  [data-theme="light"] .lang-select{border-color:rgba(255,255,255,0.35);background:var(--cubs-blue-deep);color:#fff;}
  .menu-toggle,.desk-more{display:none;background:none;border:1px solid var(--line);color:var(--chrome-text);padding:8px 12px;font-family:var(--font-type);font-size:12px;font-weight:700;}
  [data-theme="light"] .menu-toggle,[data-theme="light"] .desk-more{border-color:var(--header-border);}
  .desk-more{display:inline-flex;align-items:center;}
  .urgency-end{white-space:nowrap;}
  .tabbar,.more-sheet,.more-backdrop,.desk-more,.menu-toggle{display:none !important;}

  .hero{
    background:
      radial-gradient(ellipse at 88% 8%, rgba(204,52,51,0.28), transparent 42%),
      repeating-linear-gradient(90deg, transparent 0, transparent 28px, rgba(255,255,255,0.08) 28px, rgba(255,255,255,0.08) 29px),
      var(--cubs-blue);
    color:#fff;
    padding:56px 24px 64px;
    position:relative;
    overflow:hidden;
  }
  [data-theme="light"] .hero{
    background:
      radial-gradient(ellipse at 88% 8%, rgba(204,52,51,0.16), transparent 42%),
      repeating-linear-gradient(90deg, transparent 0, transparent 28px, rgba(14,51,134,0.07) 28px, rgba(14,51,134,0.07) 29px),
      #fff;
    color:var(--cubs-blue);
  }
  .hero::after{display:none;}
  .hero-inner{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:stretch;}
  @media(max-width:900px){.hero-inner{grid-template-columns:1fr;}}
  .hero-eyebrow{
    font-family:var(--font-type);font-size:12px;letter-spacing:1.4px;
    color:#fff;margin-bottom:12px;display:inline-flex;align-items:center;gap:8px;
  }
  [data-theme="light"] .hero-eyebrow{color:var(--cubs-red);}
  .hero h1{
    font-family:var(--font-bang);
    font-size:clamp(42px,7vw,84px);
    line-height:.88;
    letter-spacing:.01em;
    text-transform:uppercase;
    color:#fff;
  }
  [data-theme="light"] .hero h1{color:var(--cubs-blue);}
  .hero h1 em{
    font-style:normal;color:var(--cubs-red);
  }
  .hero p.sub{
    margin-top:16px;font-size:17px;max-width:44ch;color:var(--hero-sub);
  }
  .hero-ctas{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap;}
  .hero-ctas .btn{flex:none;padding:16px 26px;font-size:14px;}
  .deal-stat-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;}
  .pill{
    font-family:var(--font-type);font-size:12px;font-weight:700;
    padding:7px 12px;border:1px solid var(--cubs-red);color:var(--cubs-red);
    background:#fff;border-radius:999px;
  }
  .pill.hot{border-color:var(--cubs-red);color:#fff;background:var(--cubs-red);}
  .pill.lime{border-color:var(--cubs-blue);color:var(--cubs-blue);}
  .hero-card{
    background:#fff;
    border:1px solid #D7E0F4;
    border-radius:16px;
    color:var(--cubs-blue);
    padding:28px 24px 22px;
    position:relative;
    box-shadow:0 20px 48px rgba(14,51,134,.12);
  }
  [data-theme="light"] .hero-card{
    background:#fff;color:var(--cubs-blue);box-shadow:0 20px 48px rgba(14,51,134,.12);
  }
  .hero-card .deal-kicker{
    font-family:var(--font-type);font-size:11px;letter-spacing:.14em;color:var(--gold);
  }
  .hero-card h2{
    font-family:var(--font-bang);font-size:clamp(28px,4vw,40px);
    line-height:.95;margin:8px 0 6px;text-transform:uppercase;
  }
  .hero-card .price-row{display:flex;align-items:baseline;gap:10px;margin:10px 0 8px;}
  .hero-card .price{font-family:var(--font-bang);font-size:56px;line-height:.9;color:var(--cubs-red);}
  .hero-card .was{font-size:14px;color:var(--page-muted);text-decoration:line-through;}
  .stock-bar{height:10px;background:#E8EEF9;border:1px solid var(--cubs-blue);margin:12px 0 8px;}
  .stock-bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--cubs-blue),var(--cubs-red));width:40%;}
  .stock-meta{display:flex;justify-content:space-between;font-family:var(--font-type);font-size:12px;color:var(--accent-soft);}
  .odds{
    margin-top:14px;padding-top:12px;border-top:1px dashed rgba(255,196,77,0.3);
    font-size:13px;color:var(--hero-sub);
  }
  .odds b{color:var(--cubs-red);}

  section{padding:72px 24px;}
  .section-head{max-width:640px;margin:0 auto 40px;text-align:left;}
  @media(min-width:800px){.section-head{text-align:center;}}
  .section-head .kicker{
    font-family:var(--font-type);font-size:12px;letter-spacing:1.4px;
    color:var(--accent);display:block;margin-bottom:10px;
  }
  .section-head h2{font-family:var(--font-bang);font-size:clamp(32px,5vw,52px);letter-spacing:.02em;text-transform:uppercase;}
  .section-head p{margin-top:12px;color:var(--page-muted);font-size:15.5px;}

  .steps{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:28px;}
  @media(max-width:800px){.steps{grid-template-columns:1fr;}}
  .step-card{
    background:var(--surface);border:1px solid var(--rule);
    border-radius:16px;padding:28px 24px;
  }
  .step-num{
    font-family:var(--font-bang);font-size:22px;color:#fff;
    background:var(--cubs-red);width:36px;height:36px;
    display:flex;align-items:center;justify-content:center;margin-bottom:14px;
  }
  .step-card h3{font-size:18px;margin-bottom:8px;}
  .step-card p{font-size:14.5px;color:var(--page-muted);}

  .why-alt{background:var(--why-bg);color:var(--why-text);}
  .why-alt .section-head p{color:var(--why-muted);}
  .why-grid{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:32px;background:transparent;}
  @media(max-width:800px){.why-grid{grid-template-columns:1fr;}}
  .why-item{background:transparent;padding:0;}
  .why-item h3{font-size:19px;margin-bottom:10px;}
  .why-item p{font-size:14.5px;color:var(--why-muted);}

  .grid-products{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}
  @media(max-width:760px){.grid-products{grid-template-columns:1fr;}}
  .slip{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:16px;
    position:relative;
    padding:24px 22px 20px;
    display:flex;flex-direction:column;gap:8px;
    overflow:hidden;
    box-shadow:0 8px 24px rgba(14,51,134,.04);
  }
  .slip.flash{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);}
  .slip.daily{border-color:var(--siren);}
  .slip::before{display:none;}
  .slip-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .slip-tag{
    font-family:var(--font-type);font-size:10.5px;letter-spacing:.5px;
    background:var(--cubs-blue);color:#fff;
    padding:3px 8px;font-weight:700;
  }
  .stamp{
    font-family:var(--font-bang);font-size:13px;color:var(--accent);
    border:2px solid var(--accent);padding:3px 7px;
    transform:rotate(-6deg);white-space:nowrap;
  }
  .slip h3{font-family:var(--font-bang);font-size:28px;line-height:.95;text-transform:uppercase;margin-top:4px;}
  .slip .varietal{font-size:13px;color:var(--page-muted);font-style:italic;}
  .slip p.desc{font-size:14px;color:var(--page-muted);margin-top:2px;}
  .slip-price-row{display:flex;align-items:baseline;gap:8px;margin-top:6px;}
  .price{font-family:var(--font-bang);font-size:36px;font-weight:400;letter-spacing:.02em;}
  .srp-range{font-size:12.5px;color:var(--page-muted);}
  .slip-actions{display:flex;gap:10px;margin-top:10px;}
  .left-chip{
    position:absolute;top:14px;right:14px;
    background:var(--siren);color:#fff;
    font-family:var(--font-type);font-size:11px;font-weight:700;
    padding:4px 7px;
  }

  .feed{
    max-width:1120px;margin:0 auto;
    display:grid;grid-template-columns:1.2fr .8fr;gap:18px;
  }
  @media(max-width:800px){.feed{grid-template-columns:1fr;}}
  .feed-list{display:flex;flex-direction:column;gap:8px;}
  .feed-row{
    background:var(--surface);border:1px solid var(--rule);
    padding:12px 14px;display:flex;justify-content:space-between;gap:12px;
    font-size:14px;
  }
  .feed-row .hit{color:var(--gold);font-family:var(--font-type);font-weight:700;white-space:nowrap;}
  .heat-card{
    background:var(--cubs-red);color:#fff;padding:22px 20px;
  }
  .heat-card h3{font-family:var(--font-bang);font-size:32px;text-transform:uppercase;line-height:.95;}
  .heat-card p{margin-top:10px;opacity:.9;}
  .heat-num{font-family:var(--font-bang);font-size:64px;color:#fff;line-height:1;margin-top:12px;}

  .stamps-row{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  @media(max-width:800px){.stamps-row{grid-template-columns:1fr;}}
  .quote-card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:28px 24px;}
  .quote-card p.q{font-size:15px;color:var(--page-text);}
  .quote-card .who{font-family:var(--font-type);font-size:12px;color:var(--accent);margin-top:14px;display:block;}

  .newsletter{background:var(--cubs-red);color:#fff;}
  .newsletter-inner{max-width:640px;margin:0 auto;text-align:center;}
  .newsletter h2{font-family:var(--font-bang);font-size:40px;text-transform:uppercase;}
  .newsletter p{margin-top:10px;font-size:14.5px;color:#fff;}
  .newsletter-form{display:flex;gap:10px;margin-top:22px;max-width:420px;margin-left:auto;margin-right:auto;}
  .newsletter-form input{
    flex:1;padding:12px 14px;border:1.5px solid #fff;background:#fff;font-family:var(--font-body);font-size:14px;color:var(--cubs-blue);
  }
  .newsletter-msg{margin-top:14px;font-family:var(--font-type);font-size:13px;color:#fff;}

  footer.site{background:var(--cubs-blue);color:#D6E4FF;padding:50px 24px 30px;}
  .footer-grid{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:30px;}
  @media(max-width:760px){.footer-grid{grid-template-columns:1fr 1fr;}}
  .footer-grid h4{color:#fff;font-size:13px;letter-spacing:.5px;margin-bottom:14px;font-family:var(--font-type);}
  .footer-grid ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px;}
  .footer-grid a{font-size:14px;color:#D6E4FF;}
  .footer-grid a:hover{color:#fff;}
  .footer-brand{font-family:var(--font-chalk);font-size:26px;color:#fff;display:flex;align-items:center;gap:10px;}
  .footer-brand .brand-mark{width:40px;height:40px;filter:none;}

    display:flex;flex-direction:column;

  .rail-pts{

  .slip-watch{font-size:13px;color:var(--page-muted);}

  .right-rail{

  [data-theme="dark"] .left-rail a.rail-link.on,[data-theme="dark"] .left-rail a.rail-link:hover{background:rgba(255,255,255,.12);}
  [data-theme="dark"] .slip-now{background:rgba(255,255,255,.1);color:#fff;}

  header.site,main#app,footer.site{margin-left:var(--rail-w);}
  nav.links{display:none !important;}
  .nav-row{max-width:none;}

  .play-head{
    max-width:1120px;margin:0 auto 22px;
    display:grid;grid-template-columns:160px 1fr;gap:20px;align-items:center;
    background:var(--cubs-blue);color:#fff;padding:20px;border:3px solid var(--cubs-red);
  }
  .play-art{
    width:160px;height:160px;
    background:
      radial-gradient(circle at 30% 30%, #fff 0 8%, transparent 9%),

  }

  .track-row h3{font-size:15px;}
  .track-row .who{font-size:13px;color:var(--page-muted);}
  .track-row .dur{font-family:var(--font-type);font-size:12px;color:var(--page-muted);}
  .stage{
    max-width:1120px;margin:0 auto;

    min-height:280px;position:relative;overflow:hidden;padding:24px;

  @media(max-width:800px){
    .play-head{grid-template-columns:1fr;}

  @media(max-width:1023px){

    .rail-logo{display:flex;align-items:center;justify-content:flex-start;gap:8px;padding:4px 8px 16px;}
    .rail-logo span{display:block;font-family:var(--font-chalk);font-size:22px;line-height:1;}
    .left-rail .rail-kicker{

    .rail-tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding:0 8px;}

    radial-gradient(circle at 18% 18%, hsla(var(--h),90%,72%,.55), transparent 42%),

  var audioMaster = null;
  function startParty(tr){
    tr = tr || findTrack(nowPlayingId);
    var ctx = audioCtx;
    var master = ctx.createGain();
    master.gain.value = 0.09;
    master.connect(ctx.destination);
    audioMaster = master;
    function kick(){
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type="sine"; o.frequency.setValueAtTime(110, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(42, ctx.currentTime+0.14);
      g.gain.setValueAtTime(1, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.16);
      o.connect(g); g.connect(master); o.start(); o.stop(ctx.currentTime+0.17);
    }
    function hat(){
      var buf = ctx.createBuffer(1, ctx.sampleRate*0.05, ctx.sampleRate);
      var d = buf.getChannelData(0);
      for (var i=0;i<d.length;i++) d[i] = (Math.random()*2-1)*0.4;
      var src = ctx.createBufferSource(); src.buffer=buf;
      var f = ctx.createBiquadFilter(); f.type="highpass"; f.frequency.value=6000;
      var g = ctx.createGain(); g.gain.value=0.35;
      src.connect(f); f.connect(g); g.connect(master); src.start();
    }
    function bass(){
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type="square"; o.frequency.value = tr.notes[Math.floor(Math.random()*tr.notes.length)];
      g.gain.setValueAtTime(0.18, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.22);
      o.connect(g); g.connect(master); o.start(); o.stop(ctx.currentTime+0.24);
    }
    kick();
    musicHandles.push(setInterval(kick, tr.kick));
    musicHandles.push(setInterval(hat, tr.hat));
    musicHandles.push(setInterval(bass, tr.kick*2));
  }

  function startUnveil(code, record){
    var g = findGift(code);
    if (!g || g.opened) return;
    var duration = 8000 + Math.random()*1000;
    var start = Date.now();
    var recBtn = document.getElementById("unveil-rec");
    var goBtn = document.getElementById("unveil-go");
    if (recBtn) recBtn.disabled = true;
    if (goBtn) goBtn.disabled = true;
    playTrack(g.song);
    var canvas = document.getElementById("unveil-cv");
    var ctx = canvas ? canvas.getContext("2d") : null;
    if (record && canvas && window.MediaRecorder){
      var mime = "";
      ["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm","video/mp4"].some(function(m){
        if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)){ mime=m; return true; }
      });
      try {
        var stream = canvas.captureStream(30);
        if (audioMaster && audioCtx){
          try {
            var dest = audioCtx.createMediaStreamDestination();
            audioMaster.connect(dest);
            if (dest.stream.getAudioTracks()[0]) stream.addTrack(dest.stream.getAudioTracks()[0]);
          } catch(err){}
        }
        unveilChunks = [];
        unveilRec = mime ? new MediaRecorder(stream, {mimeType:mime}) : new MediaRecorder(stream);
        unveilRec.ondataavailable = function(e){ if (e.data && e.data.size) unveilChunks.push(e.data); };
        unveilRec.onstop = function(){
          var type = (unveilRec && unveilRec.mimeType) || "video/webm";
          var blob = new Blob(unveilChunks, {type:type});
          var a = document.getElementById("gift-dl");
          var box = document.getElementById("gift-rec-ok");
          if (a){
            a.href = URL.createObjectURL(blob);
            a.download = "wine-detention-unveil."+(type.indexOf("mp4")>=0?"mp4":"webm");
          }
          if (box) box.classList.add("on");
        };
        unveilRec.start(200);
      } catch(err){
        showToast("This browser won't record. The unveil still slams.");
      }
    } else if (record){
      showToast("Recording isn't available here. Unveiling anyway.");
    }
    function tick(){
      var left = duration - (Date.now()-start);
      var body = document.getElementById("unveil-body");
      if (left > 0){
        if (body) body.innerHTML = '<p class="unveil-sub">Unveiling</p><div class="unveil-num">'+Math.max(1, Math.ceil(left/1000))+'</div>';
        if (ctx) paintUnveil(ctx, g, left, false);
        unveilHandles.push(setTimeout(tick, 90));
      } else {
        g.mult = rollGiftMult();
        g.payout = Math.round(g.amount * g.mult * 100)/100;
        g.opened = true;
        saveGifts();
        awardLaunchBadges();
        addPoints(25);
        if (body) body.innerHTML = '<div class="unveil-boom">'+formatMult(g.mult)+'</div><p>'+money(g.amount)+' became <b>'+money(g.payout)+'</b> hall credit.</p>';
        if (ctx) paintUnveil(ctx, g, 0, true);
        burstFx();
        showToast("Bonus "+formatMult(g.mult)+" · "+money(g.payout));
        if (unveilRec && unveilRec.state==="recording"){
          unveilHandles.push(setTimeout(function(){ try{ unveilRec.stop(); }catch(e){} }, 1600));
        }
      }
    }
    tick();
  }

  function signupUser(name, email, pass){
    email = (email||"").trim().toLowerCase();
    name = (name||"").trim();
    if (!name || !email || !pass || pass.length<4) return "Name, email, and a 4+ character password.";
    var users = loadUsers();
    if (users.some(function(u){ return u.email===email; })) return "That email already has a hall pass. Log in.";
    users.push({name:name, email:email, pass:btoa(unescape(encodeURIComponent(pass)))});
    saveUsers(users);
    setSession({name:name, email:email});
    return "";
  }
  function loginUser(email, pass){
    email = (email||"").trim().toLowerCase();
    var users = loadUsers();
    var encoded = btoa(unescape(encodeURIComponent(pass||"")));
    var hit = users.filter(function(u){ return u.email===email && u.pass===encoded; })[0];
    if (!hit) return "No match. Check the email/password or sign up.";
    setSession(hit);
    return "";
  }

  function hallReply(q){
    var s = String(q||"").toLowerCase();
    if (/gift|bonus|unveil|card/.test(s)) return "Gift cards run $10–$500. After you send one, a private unveil shows a bonus — never under +4%, usually around +35%, rarely up to 18×. Demo only: no money moves.";
    if (/music|jukebox|party|song|play|radio/.test(s)) return "The mini player is original Detention Radio. Play, skip, or open Party for the full jukebox.";
    if (/login|account|sign|pass/.test(s)) return "Tap Log in in the header. New here? Switch to Sign up on that sheet. It stays on this device.";
    if (/how it works|how does/.test(s)) return "Pick a locker. Pay one price. At checkout we assign three bottles from that pool — every one at least the buy-in. Vintage, AVA, and SRP are listed before you pay.";
    if (/drop|wine|buy|shop|sentence|locker|pinot|cabernet|chardonnay|sauvignon|bottle|allocation/.test(s)) return "Five lockers are open — Sauvignon Blanc, Chardonnay, Pinot, Cabernet, and Icon. Every bottle lists vintage, AVA, and SRP. Floor is always the buy-in. We don’t ship alcohol in this preview.";
    if (/age|21|legal/.test(s)) return "You must be 21+. This is a demo, not a licensed shop.";
    if (/pt|point|pts|quest/.test(s)) return "PTS live on this device. Buys, shares, and quests add up. 40 pts bumps a jukebox request.";
    if (/ship|deliver|hk|napa|moscow/.test(s)) return "We sketch Napa lanes to Hong Kong, Shanghai, Moscow, Tokyo, London, and Dubai. Shipping stays a sketch until a licensed partner is live.";
    if (/support|help|hi|hey|hello|thanks|thank/.test(s)) return conciergeHello();
    return "I can help with today’s drop, gifts, the radio, points, or your pass. Pick a button or type a question.";
  }

  function ensureChat(){
    var root = document.getElementById("chat-root");
    if (!root) return;
    if (!chatLog.length) chatLog.push({who:"bot", text: conciergeHello()});
    if (!chatReady){
      chatReady = true;
      var fab = document.getElementById("chat-fab");
      var xc = document.getElementById("chat-x");
      var form = document.getElementById("chat-form");
      if (fab) fab.onclick = function(){
        chatOpen = !chatOpen;
        if (chatOpen) chatUnread = false;
        paintChat();
      };
      if (xc) xc.onclick = function(){ chatOpen=false; paintChat(); };
      if (form) form.onsubmit = function(e){
        e.preventDefault();
        var inp = document.getElementById("chat-in");
        var q = (inp && inp.value || "").trim();
        if (!q) return;
        inp.value = "";
        chatLog.push({who:"me", text:q});
        chatLog.push({who:"bot", text:hallReply(q)});
        chatOpen = true;
        chatUnread = false;
        paintChat();
      };
    }
    paintChat();
  }

  function paintChat(){
    var panel = document.getElementById("chat-panel");
    var log = document.getElementById("chat-log");
    var chips = document.getElementById("chat-chips");
    var fab = document.getElementById("chat-fab");
    var xbtn = document.getElementById("chat-x");
    var stamp = document.getElementById("chat-stamp");
    if (!panel) return;
    panel.classList.toggle("hidden", !chatOpen);
    document.body.classList.toggle("chat-open", chatOpen);
    if (fab){
      fab.setAttribute("aria-expanded", chatOpen ? "true" : "false");
      fab.classList.toggle("hidden", chatOpen);
      fab.classList.toggle("unread", !chatOpen && chatUnread);
    }
    if (xbtn) xbtn.classList.toggle("hidden", !chatOpen);
    if (stamp){
      var d = new Date();
      stamp.textContent = "Today " + d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
    }
    if (log){
      log.innerHTML = chatLog.map(function(m){
        return '<div class="chat-bubble '+(m.who==="me"?"me":"bot")+'">'+esc(m.text)+'</div>';
      }).join("");
      log.scrollTop = log.scrollHeight;
    }
    if (chips){
      var qs = ["Shop today's drop","Send a gift","Get support","How it works"];
      chips.innerHTML = qs.map(function(q){ return '<button type="button" data-chip="'+esc(q)+'">'+esc(q)+'</button>'; }).join("");
      chips.querySelectorAll("[data-chip]").forEach(function(b){
        b.onclick = function(){
          var q = b.getAttribute("data-chip");
          chatLog.push({who:"me", text:q});
          chatLog.push({who:"bot", text:hallReply(q)});
          chatOpen = true;
          chatUnread = false;
          paintChat();
        };
      });
    }
  }

    if (route === "/trade") return pageTrade();
    if (route === "/giveaways") return pageGiveaways();
    if (route === "/quests") return pageQuests();
    if (route === "/leaderboard") return pageLeaderboard();
    if (route === "/socials") return pageSocials();
    if (route === "/how-it-works") return pageHowItWorks();
    if (route === "/about") return pageAbout();
    if (route === "/faq") return pageFAQ();
    if (route === "/contact") return pageContact();
    if (route === "/policy/privacy") return pagePolicy("privacy");
    if (route === "/policy/terms") return pagePolicy("terms");
    if (route === "/account") return pageAccount();
    if (route === "/gifts") return pageGiftsShop();
    if (route.indexOf("/gifts/new")===0) return pageGiftNew(route);
    if (route === "/gifts/redeem") return pageGiftRedeem();
    if (route === "/gifts/mine") return pageGiftMine();
    if (route.indexOf("/gifts/sent/")===0) return pageGiftSent(route.replace("/gifts/sent/",""));
    if (route.indexOf("/gifts/open/")===0) return pageGiftOpen(route.replace("/gifts/open/",""));
    if (route === "/cart") return pageCart();
    if (route === "/checkout") return pageCheckout();
    if (route === "/confirmation") return pageConfirmation();
    return '<div class="content-block"><h2>'+t("page404")+'</h2><p><a href="#/">'+t("backHome")+'</a></p></div>';
  }

  function closeAuthOverlay(){
    var back = lastContentRoute;
    if (!back || back==="/login" || back==="/signup") back = "/";
    navigate(back);
  }

  function bindAuth(route){
    var overlay = document.getElementById("auth-overlay");
    var aform = document.getElementById("auth-form");
    var xc = document.getElementById("auth-close");
    if (xc) xc.onclick = closeAuthOverlay;
    if (overlay) overlay.onclick = function(e){ if (e.target===overlay) closeAuthOverlay(); };
    if (aform) aform.addEventListener("submit", function(e){
      e.preventDefault();
      var msg = route==="/signup"
        ? signupUser(document.getElementById("auth-name").value, document.getElementById("auth-email").value, document.getElementById("auth-pass").value)
        : loginUser(document.getElementById("auth-email").value, document.getElementById("auth-pass").value);
      var box = document.getElementById("auth-msg");
      if (msg){ if (box) box.textContent = msg; return; }
      showToast(route==="/signup" ? "Hall pass created." : "You're in.");
      var next = giftReturnTo || lastContentRoute || "/";
      if (next==="/login" || next==="/signup") next = "/";
      giftReturnTo = "";
      navigate(next);
    });
  }

  function render(){
    var route = currentRoute().split("?")[0];
    if (route.indexOf("/gifts/open/")!==0) stopUnveil();
    var isAuth = route === "/login" || route === "/signup";
    if (!isAuth) lastContentRoute = route;
    var under = lastContentRoute;
    if (under==="/login" || under==="/signup") under = "/";
    var html = pageHTML(isAuth ? under : route);
    document.getElementById("app").innerHTML = html;
    var overlay = document.getElementById("auth-overlay");
    if (overlay){
      document.body.classList.toggle("auth-open", isAuth);
      if (isAuth){
        overlay.classList.remove("hidden");
        overlay.removeAttribute("hidden");
        overlay.innerHTML = pageAuth(route==="/signup" ? "signup" : "login");
      } else {
        overlay.classList.add("hidden");
        overlay.setAttribute("hidden", "");
        overlay.innerHTML = "";
        overlay.onclick = null;
      }
    }
    renderCartCount();
    highlightNav(isAuth ? under : route);
    bindPageEvents(isAuth ? under : route);
    if (isAuth) bindAuth(route);
    closeMore();
    renderNav();
    renderHud();
    renderNowBar();
  }

  function highlightNav(route){
    document.querySelectorAll("nav.links a[data-route]").forEach(function(a){
      var r = a.getAttribute("data-route");
      a.classList.toggle("active", r===route || (r==="/collections" && route.indexOf("/product/")===0) || (r==="/gifts" && route.indexOf("/gifts")===0));
    });
  }

  function bindPageEvents(route){
    document.querySelectorAll("[data-add]").forEach(function(btn){
      btn.addEventListener("click", function(){ addToCart(btn.getAttribute("data-add"), 1); });
    });
    if (route.indexOf("/product/") === 0){
      var slug = route.replace("/product/","");
      var qty = 1;
      var qtyVal = document.getElementById("qty-val");
      document.getElementById("qty-minus").addEventListener("click", function(){
        qty = Math.max(1, qty-1); qtyVal.textContent = qty;
      });
      document.getElementById("qty-plus").addEventListener("click", function(){
        qty = qty+1; qtyVal.textContent = qty;
      });
      document.getElementById("pd-add").addEventListener("click", function(){ addToCart(slug, qty); });
    }
    if (route === "/faq" || route === "/gifts"){
      document.querySelectorAll(".faq-item").forEach(function(item){
        var q = item.querySelector(".faq-q");
        if (q) q.addEventListener("click", function(){ item.classList.toggle("open"); });
      });
    }
    if (route === "/cart"){
      document.querySelectorAll("[data-remove]").forEach(function(btn){
        btn.addEventListener("click", function(){ removeFromCart(btn.getAttribute("data-remove")); });
      });
      document.querySelectorAll("[data-inc]").forEach(function(btn){
        btn.addEventListener("click", function(){
          var s = btn.getAttribute("data-inc");
          var item = cart.find(function(i){return i.slug===s;});
          setQty(s, item.qty+1);
        });
      });
      document.querySelectorAll("[data-dec]").forEach(function(btn){
        btn.addEventListener("click", function(){
          var s = btn.getAttribute("data-dec");
          var item = cart.find(function(i){return i.slug===s;});
          setQty(s, item.qty-1);
        });
      });
    }
    if (route === "/checkout"){
      var form = document.getElementById("checkout-form");
      if (form) form.addEventListener("submit", function(e){ e.preventDefault(); processOrder(); });
      if (currentUser){
        var em = document.getElementById("ch-email");
        var fn = document.getElementById("ch-first");
        if (em && !em.value) em.value = currentUser.email;
        if (fn && !fn.value) fn.value = (currentUser.name||"").split(" ")[0];
      }
    }
    if (route === "/account"){
      var lo = document.getElementById("logout-btn");
      if (lo) lo.addEventListener("click", logoutUser);
    }
    if (route === "/party"){
      var pn = document.getElementById("play-now");
      if (pn) pn.addEventListener("click", toggleMusic);
      var pprev = document.getElementById("play-prev");
      var pnext = document.getElementById("play-next");
      if (pprev) pprev.addEventListener("click", function(){ skipTrack(-1); });
      if (pnext) pnext.addEventListener("click", function(){ skipTrack(1); });
      document.querySelectorAll("[data-play]").forEach(function(btn){
        btn.addEventListener("click", function(){ playTrack(btn.getAttribute("data-play")); });
      });
      document.querySelectorAll("[data-req]").forEach(function(btn){
        btn.addEventListener("click", function(){ requestTrack(btn.getAttribute("data-req")); });
      });
      var st = document.getElementById("join-stage");
      if (st) st.addEventListener("click", joinStage);
    }
    if (route === "/contact"){
      var cform = document.getElementById("contact-form");
      cform.addEventListener("submit", function(e){
        e.preventDefault();
        document.getElementById("contact-msg").textContent = t("contactOk");
        cform.reset();
      });
    }
    if (route === "/"){
      var nform = document.getElementById("newsletter-form");
      if (nform){
        nform.addEventListener("submit", function(e){
          e.preventDefault();
          document.getElementById("newsletter-msg").textContent = t("newsOk");
          nform.reset();
        });
      }
    }
    document.querySelectorAll("[data-sit]").forEach(function(btn){
      btn.addEventListener("click", function(){
        addPoints(0, "live");
        showToast("Sat in "+btn.getAttribute("data-sit")+" · +15");
      });
    });
    var crew = document.getElementById("join-crew");
    if (crew) crew.addEventListener("click", function(){
      crewFilled = Math.min(12, crewFilled+1);
      addPoints(0, "crew");
      showToast("Crew "+crewFilled+"/12");
      render();
    });
    var post = document.getElementById("post-form");
    if (post) post.addEventListener("submit", function(e){
      e.preventDefault();
      var tx = document.getElementById("post-text").value.trim();
      if (!tx) return;
      posts.unshift({who:"YOU", text:tx});
      addPoints(0, "post");
      showToast(t("posted"));
      render();
    });
    document.querySelectorAll("[data-enter]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var g = GIVEAWAYS.filter(function(x){ return x.id===btn.getAttribute("data-enter"); })[0];
        if (!g) return;
        if (points < g.cost){ showToast("Need "+g.cost+" pts"); return; }
        points -= g.cost;
        persist();
        showToast("Entered "+g.name);
        renderHud();
      });
    });
    var sd = document.getElementById("share-drop");
    if (sd) sd.addEventListener("click", shareDrop);
    var fm = document.getElementById("farm-more");
    if (fm) fm.addEventListener("click", crushGrape);
    document.querySelectorAll("[data-jump]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var el = document.getElementById("cat-"+btn.getAttribute("data-jump"));
        if (el) el.scrollIntoView({behavior:"smooth", block:"start"});
      });
    });
    if (route.indexOf("/gifts/new")===0){
      document.querySelectorAll("[data-des]").forEach(function(btn){
        btn.addEventListener("click", function(){
          readGiftForm();
          giftDraft.designId = btn.getAttribute("data-des");
          navigate("/gifts/new/"+giftDraft.designId);
        });
      });
      document.querySelectorAll("[data-fmt]").forEach(function(btn){
        btn.addEventListener("click", function(){
          giftDraft.format = btn.getAttribute("data-fmt");
          document.querySelectorAll("[data-fmt]").forEach(function(b){ b.classList.toggle("on", b===btn); });
        });
      });
      document.querySelectorAll("[data-who]").forEach(function(btn){
        btn.addEventListener("click", function(){
          giftDraft.who = btn.getAttribute("data-who");
          document.querySelectorAll("[data-who]").forEach(function(b){ b.classList.toggle("on", b===btn); });
          var wrap = document.getElementById("gift-to-wrap");
          if (wrap) wrap.style.display = giftDraft.who==="me" ? "none" : "";
        });
      });
      document.querySelectorAll("[data-amt]").forEach(function(btn){
        btn.addEventListener("click", function(){
          giftDraft.custom = false;
          giftDraft.amount = Number(btn.getAttribute("data-amt"));
          document.querySelectorAll("[data-amt]").forEach(function(b){ b.classList.toggle("on", b===btn); });
          var other = document.querySelector(".gamt .other");
          if (other) other.classList.remove("on");
          var prev = document.getElementById("gift-preview");
          if (prev) prev.innerHTML = giftCardHTML(findGiftDesign(giftDraft.designId), {lg:true, amount:giftDraft.amount});
        });
      });
      var otherIn = document.getElementById("gift-other");
      if (otherIn){
        function applyOther(){
          giftDraft.custom = true;
          var n = Number(otherIn.value);
          var err = document.getElementById("gift-amt-err");
          if (n<10 || n>500){ if (err) err.textContent = "Enter an amount between $10 and $500."; return; }
          if (err) err.textContent = "";
          giftDraft.amount = n;
          document.querySelectorAll("[data-amt]").forEach(function(b){ b.classList.remove("on"); });
          var lab = otherIn.parentNode;
          if (lab) lab.classList.add("on");
          var prev = document.getElementById("gift-preview");
          if (prev) prev.innerHTML = giftCardHTML(findGiftDesign(giftDraft.designId), {lg:true, amount:giftDraft.amount});
        }
        otherIn.addEventListener("focus", applyOther);
        otherIn.addEventListener("input", applyOther);
      }
      function bindCount(id, countId, key, max){
        var el = document.getElementById(id);
        var c = document.getElementById(countId);
        if (!el) return;
        el.addEventListener("input", function(){
          giftDraft[key] = el.value;
          if (c) c.textContent = el.value.length+"/"+max;
        });
      }
      bindCount("gift-to","to-count","to",30);
      bindCount("gift-from","from-count","from",30);
      bindCount("gift-note","note-count","note",250);
      var song = document.getElementById("gift-song");
      if (song) song.addEventListener("change", function(){ giftDraft.song = song.value; });
      var send = document.getElementById("gift-send");
      if (send) send.addEventListener("click", function(){ readGiftForm(); sendGiftNow(); });
      var addc = document.getElementById("gift-cart");
      if (addc) addc.addEventListener("click", function(){ readGiftForm(); addGiftToCart(); });
    }
    if (route === "/gifts/redeem"){
      var go = document.getElementById("gift-go");
      if (go) go.addEventListener("click", function(){
        var code = (document.getElementById("gift-code").value||"").trim().toUpperCase();
        if (!findGift(code)){ showToast("No gift with that code."); return; }
        navigate("/gifts/open/"+code);
      });
    }
    var copy = document.getElementById("gift-copy");
    if (copy) copy.addEventListener("click", function(){
      var url = copy.getAttribute("data-url");
      if (navigator.share){ navigator.share({title:"Wine Detention gift", url:url}).catch(function(){}); }
      else if (navigator.clipboard) navigator.clipboard.writeText(url).catch(function(){});
      showToast("Share link copied.");
    });
    var uv = document.getElementById("unveil-go");
    if (uv) uv.addEventListener("click", function(){ startUnveil(uv.getAttribute("data-code"), false); });
    var ur = document.getElementById("unveil-rec");
    if (ur) ur.addEventListener("click", function(){ startUnveil(ur.getAttribute("data-code"), true); });
  }

  function processOrder(){
    var giftItems = cart.filter(function(i){ return i.kind==="gift"; });
    var wineItems = cart.filter(function(i){ return i.kind!=="gift"; });
    var made = giftItems.map(function(i){ return persistGift(buildGiftFrom(i)); });
    if (!wineItems.length){
      cart = [];
      renderCartCount();
      if (made.length===1) navigate("/gifts/sent/"+made[0].code);
      else navigate("/gifts/mine");
      return;
    }
    var groups = wineItems.map(function(item){
      var p = locProduct(findProduct(item.slug));
      var bottles = [];
      for (var u=0; u<item.qty; u++){
        for (var b=0; b<3; b++){ bottles.push(weightedPick(p.pool)); }
      }
      return { name: p.name + " ×" + item.qty, pricePerBottle: p.price / 3, bottles: bottles };
    });
    var value = 0;
    groups.forEach(function(g){ g.bottles.forEach(function(b){ value += b.value; }); });
    lastOrder = {
      orderId: "WD-" + Math.floor(100000 + Math.random()*899999),
      paid: cartTotal(),
      value: value,
      groups: groups,
      gifts: made
    };
    cart = [];
    renderCartCount();
    navigate("/confirmation");
  }

  function persist(){
    try {
      localStorage.setItem("wd-kit", "cubs");
      localStorage.setItem("wd-theme", theme);
      localStorage.setItem("wd-lang", lang);
      localStorage.setItem("wd-points", String(points));
      localStorage.setItem("wd-quests", JSON.stringify(questsDone));
      localStorage.setItem("wd-farm", String(farmCount));
      localStorage.setItem("wd-gate", gateShown ? "1" : "0");
      if (currentUser) localStorage.setItem("wd-session", JSON.stringify(currentUser));
    } catch (e) {}
  }

  function loadPrefs(){
    try {
      var savedTheme = localStorage.getItem("wd-kit")==="cubs" ? localStorage.getItem("wd-theme") : "light";
      var savedLang = localStorage.getItem("wd-lang");
      if (savedTheme === "light" || savedTheme === "dark") theme = savedTheme;
      else theme = "light";
      if (savedLang && STR[savedLang]) lang = savedLang;
      var p = parseInt(localStorage.getItem("wd-points")||"0",10);
      if (!isNaN(p)) points = p;
      var qd = JSON.parse(localStorage.getItem("wd-quests")||"{}");
      if (qd && typeof qd==="object") questsDone = qd;
      farmCount = parseInt(localStorage.getItem("wd-farm")||"0",10)||0;
      if (localStorage.getItem("wd-gate")==="1") gateShown = true;
      var sess = JSON.parse(localStorage.getItem("wd-session")||"null");
      if (sess && sess.email) currentUser = sess;
    } catch (e) {}
    loadGifts();
  }

  function wireChrome(){
    var deskMore = document.getElementById("desk-more");
    if (deskMore) deskMore.addEventListener("click", openMore);
    var moreClose = document.getElementById("more-close");
    if (moreClose) moreClose.addEventListener("click", closeMore);
    var moreBack = document.getElementById("more-backdrop");
    if (moreBack) moreBack.addEventListener("click", closeMore);
    document.getElementById("theme-toggle").addEventListener("click", function(){
      theme = theme === "dark" ? "light" : "dark";
      persist();
      applyPrefs();
      render();
    });
    document.getElementById("lang-select").addEventListener("change", function(){
      lang = this.value;
      persist();
      applyPrefs();
      render();
    });
  }

  LANGS.forEach(function(item){
    var opt = document.createElement("option");
    opt.value = item.code;
    opt.textContent = item.label;
    document.getElementById("lang-select").appendChild(opt);
  });
  wireChrome();

  function updateLiveChrome(){
    var clock = document.getElementById("day-clock");
    if (clock) clock.textContent = formatRemain(endOfDay() - Date.now());
    var w = document.getElementById("watchers");
    if (w) w.textContent = watchersNow().toLocaleString() + " watching";
    var sw = document.getElementById("slip-watch");
    if (sw) sw.textContent = watchersNow().toLocaleString() + " watching";
    var lyric = document.getElementById("lyric-line");
    var beat = Math.floor(Date.now()/3000);
    if (lyric && beat !== lyricIdx){
      lyricIdx = beat;
      lyric.textContent = LYRICS[beat % LYRICS.length];
    }
    if (onStage && beat%2===0) onStage.viewers = Math.max(15, Math.min(100, onStage.viewers + (Math.random()>.5?1:-1)));
  }

  var scrolledOnce = false;
  window.addEventListener("scroll", function(){
    if (scrolledOnce || window.scrollY < 200) return;
    scrolledOnce = true;
    addPoints(0, "scroll");
  }, {passive:true});

  loadPrefs();
  applyPrefs();
  var ticker = document.getElementById("ticker-track");
  if (ticker) ticker.innerHTML = tickerHTML();
  if (gateShown) document.getElementById("age-gate").classList.add("hidden");
  render();
  updateLiveChrome();
  setInterval(updateLiveChrome, 1000);
})();
</script>
</body>
</html>
