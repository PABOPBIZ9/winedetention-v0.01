<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wine Detention</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600;700&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cubs-blue:#1a0b10;
    --cubs-blue-deep:#0d0608;
    --cubs-blue-ink:#2a0f16;
    --cubs-red:#ff2d42;
    --cubs-red-dark:#c81b2d;
    --ivory:#f6ecd8;
    --ivory-deep:#e8d7b4;
    --manila:#2a1418;
    --manila-dark:#4a1f28;
    --ink:#14080c;
    --gold:#ffc44d;
    --lime:#d6ff3c;
    --siren:#ff2d42;
    --font-chalk:'Caveat',cursive;
    --font-type:'IBM Plex Mono',monospace;
    --font-body:'IBM Plex Sans',sans-serif;
    --font-bang:'Anton',sans-serif;
  }

  [data-theme="dark"]{
    --chrome:#12070a;
    --chrome-deep:#080406;
    --chrome-text:#f6ecd8;
    --chrome-muted:#c9a8a4;
    --page:#14080c;
    --page-text:#f6ecd8;
    --page-muted:#c4a39a;
    --card:#241014;
    --card-border:#5a2430;
    --line:rgba(255,196,77,0.22);
    --accent:var(--siren);
    --accent-soft:#ff7a88;
    --accent-ink:#2a0a10;
    --why-bg:#1c0c10;
    --why-text:#f6ecd8;
    --why-muted:#c9a8a4;
    --gate-overlay:rgba(10,4,6,0.94);
    --header-border:rgba(255,196,77,0.18);
    --hero-sub:#e8cfc4;
    --surface:#1c0e12;
    --rule:#4a2430;
  }

  [data-theme="light"]{
    --chrome:#fff6e8;
    --chrome-deep:#f4e4c4;
    --chrome-text:#1a0b10;
    --chrome-muted:#6a3038;
    --page:#fff8ee;
    --page-text:#1a0b10;
    --page-muted:#6a4044;
    --card:#fff;
    --card-border:#efc8a8;
    --line:rgba(255,45,66,0.16);
    --accent:var(--siren);
    --accent-soft:#ffd0d4;
    --accent-ink:#6a121c;
    --why-bg:#1a0b10;
    --why-text:#f6ecd8;
    --why-muted:#c9a8a4;
    --gate-overlay:rgba(255,246,232,0.96);
    --header-border:rgba(26,11,16,0.12);
    --hero-sub:#4a2428;
    --surface:#fff;
    --rule:#efd4bc;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:var(--font-body);
    color:var(--page-text);
    background:var(--page);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  img,svg{display:block;max-width:100%;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  h1,h2,h3,h4{margin:0;font-weight:600;}
  p{margin:0;}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px;}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

  #age-gate{
    position:fixed;inset:0;background:var(--gate-overlay);
    display:flex;align-items:center;justify-content:center;
    z-index:200;padding:20px;
  }
  #age-gate.hidden{display:none;}
  .gate-card{
    background:var(--card);
    border:2px solid var(--gold);
    max-width:400px;width:100%;
    padding:36px 32px 30px;
    text-align:center;
    box-shadow:0 0 0 8px rgba(255,45,66,0.18), 0 20px 50px rgba(0,0,0,0.45);
  }
  .gate-card::before{
    content:attr(data-pass);
    font-family:var(--font-type);
    font-size:11px;letter-spacing:1.5px;
    color:var(--accent);
    display:block;margin-bottom:14px;
  }
  .gate-card h2{font-family:var(--font-chalk);font-size:38px;color:var(--page-text);line-height:1.05;}
  .gate-card p{margin-top:12px;font-size:14.5px;color:var(--page-muted);}
  .gate-actions{display:flex;gap:10px;margin-top:24px;}
  .btn{
    font-family:var(--font-type);
    font-size:13px;
    padding:12px 18px;
    border:1.5px solid var(--page-text);
    background:var(--page);
    color:var(--page-text);
    transition:transform .12s ease, background .12s ease, box-shadow .12s ease;
    flex:1;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn-primary{
    background:var(--accent);border-color:var(--accent);color:#fff;
    box-shadow:0 0 0 0 rgba(255,45,66,0.5);
    animation:pulseCta 1.8s ease-in-out infinite;
  }
  .btn-primary:hover{background:var(--cubs-red-dark);}
  .btn-dark{background:var(--gold);border-color:var(--gold);color:#1a0b10;}
  .btn-dark:hover{filter:brightness(1.08);}
  .btn-ghost{
    background:transparent;border-color:var(--line);color:var(--chrome-text);
    padding:8px 10px;flex:none;min-width:42px;
  }
  [data-theme="light"] .btn-ghost{border-color:var(--header-border);}
  .btn-block{width:100%;}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;animation:none;}
  @keyframes pulseCta{
    0%,100%{box-shadow:0 0 0 0 rgba(255,45,66,0.0);}
    50%{box-shadow:0 0 0 8px rgba(255,45,66,0.18);}
  }

  .ticker{
    background:var(--gold);color:#1a0b10;
    overflow:hidden;white-space:nowrap;
    font-family:var(--font-type);font-size:12px;font-weight:700;
    letter-spacing:.04em;
    border-bottom:2px solid #1a0b10;
  }
  .ticker-track{
    display:inline-flex;gap:48px;padding:8px 0;
    animation:ticker 28s linear infinite;
  }
  .ticker b{color:#9a0f1c;}
  @keyframes ticker{from{transform:translateX(0);}to{transform:translateX(-50%);}}

  header.site{
    background:var(--chrome);
    color:var(--chrome-text);
    position:sticky;top:0;z-index:100;
    border-bottom:1px solid var(--header-border);
  }
  .urgency{
    display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;
    background:#9a1020;color:#fff;
    padding:8px 16px;
    font-family:var(--font-type);font-size:12px;font-weight:700;
    letter-spacing:.06em;
  }
  .live-dot{
    display:inline-flex;align-items:center;gap:6px;
    background:#1a0b10;color:var(--lime);
    padding:3px 8px;
  }
  .live-dot::before{
    content:"";width:7px;height:7px;border-radius:50%;background:var(--lime);
    box-shadow:0 0 0 0 rgba(214,255,60,0.7);
    animation:liveblink 1.1s infinite;
  }
  @keyframes liveblink{
    0%{box-shadow:0 0 0 0 rgba(214,255,60,0.7);}
    70%{box-shadow:0 0 0 8px rgba(214,255,60,0);}
    100%{box-shadow:0 0 0 0 rgba(214,255,60,0);}
  }
  .clock{
    font-family:var(--font-bang);font-size:20px;letter-spacing:.08em;
    color:var(--gold);background:#1a0b10;padding:2px 10px;
  }
  .nav-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 24px;max-width:1120px;margin:0 auto;
    gap:12px;
  }
  .brand{
    font-family:var(--font-chalk);
    font-size:30px;
    color:var(--chrome-text);
    display:flex;align-items:center;gap:8px;
    white-space:nowrap;
  }
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;box-shadow:0 0 10px var(--accent);}
  nav.links{display:flex;gap:18px;align-items:center;flex-wrap:wrap;}
  nav.links a{
    font-size:14px;font-weight:600;
    color:var(--chrome-text);opacity:.85;
    padding:4px 2px;border-bottom:2px solid transparent;
    transition:opacity .15s, border-color .15s;
  }
  nav.links a:hover, nav.links a.active{opacity:1;border-color:var(--gold);}
  .chrome-tools{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .lang-select{
    font-family:var(--font-type);
    font-size:12px;
    padding:7px 8px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--chrome-text);
    max-width:128px;
  }
  [data-theme="light"] .lang-select{border-color:var(--header-border);background:#fff;}
  .cart-link{
    display:flex;align-items:center;gap:6px;
    font-family:var(--font-type);
    background:var(--gold);color:#1a0b10;border:1px solid var(--gold);
    padding:8px 12px;
    font-size:13px;font-weight:700;
  }
  [data-theme="light"] .cart-link{border-color:var(--gold);}
  .cart-count{
    background:var(--accent);color:#fff;
    border-radius:50%;min-width:18px;height:18px;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:11px;padding:0 4px;
  }
  .menu-toggle{display:none;background:none;border:1px solid var(--line);color:var(--chrome-text);padding:8px 10px;}
  [data-theme="light"] .menu-toggle{border-color:var(--header-border);}

  @media(max-width:980px){
    nav.links{
      display:none;
      position:absolute;top:100%;left:0;right:0;
      background:var(--chrome);
      flex-direction:column;align-items:flex-start;
      padding:16px 24px 20px;gap:14px;
      border-bottom:1px solid var(--header-border);
    }
    nav.links.open{display:flex;}
    .menu-toggle{display:block;}
  }

  .hero{
    background:
      radial-gradient(ellipse at 80% 0%, rgba(255,45,66,0.28), transparent 46%),
      radial-gradient(ellipse at 10% 80%, rgba(255,196,77,0.12), transparent 40%),
      var(--chrome);
    color:var(--chrome-text);
    padding:36px 24px 48px;
    position:relative;
    overflow:hidden;
  }
  [data-theme="light"] .hero{
    background:
      radial-gradient(ellipse at 80% 10%, rgba(255,45,66,0.14), transparent 40%),
      var(--ivory);
  }
  .hero::after{display:none;}
  .hero-inner{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:stretch;}
  @media(max-width:900px){.hero-inner{grid-template-columns:1fr;}}
  .hero-eyebrow{
    font-family:var(--font-type);font-size:12px;letter-spacing:1.4px;
    color:var(--lime);margin-bottom:12px;display:inline-flex;align-items:center;gap:8px;
  }
  [data-theme="light"] .hero-eyebrow{color:#9a1020;}
  .hero h1{
    font-family:var(--font-bang);
    font-size:clamp(42px,7vw,84px);
    line-height:.88;
    letter-spacing:.01em;
    text-transform:uppercase;
    color:var(--chrome-text);
  }
  .hero h1 em{
    font-style:normal;color:var(--gold);
  }
  .hero p.sub{
    margin-top:16px;font-size:17px;max-width:44ch;color:var(--hero-sub);
  }
  .hero-ctas{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap;}
  .hero-ctas .btn{flex:none;padding:16px 26px;font-size:14px;}
  .deal-stat-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;}
  .pill{
    font-family:var(--font-type);font-size:12px;font-weight:700;
    padding:7px 10px;border:1px solid var(--gold);color:var(--gold);
    background:rgba(255,196,77,0.08);
  }
  .pill.hot{border-color:var(--accent);color:#fff;background:var(--accent);}
  .pill.lime{border-color:var(--lime);color:var(--lime);}
  .hero-card{
    background:linear-gradient(180deg,#2b1218,#17090d);
    border:2px solid var(--gold);
    padding:22px 20px 18px;
    position:relative;
    box-shadow:12px 12px 0 #9a1020;
  }
  [data-theme="light"] .hero-card{
    background:#fff;color:#1a0b10;box-shadow:12px 12px 0 #ff2d42;
  }
  .hero-card .deal-kicker{
    font-family:var(--font-type);font-size:11px;letter-spacing:.14em;color:var(--gold);
  }
  .hero-card h2{
    font-family:var(--font-bang);font-size:clamp(28px,4vw,40px);
    line-height:.95;margin:8px 0 6px;text-transform:uppercase;
  }
  .hero-card .price-row{display:flex;align-items:baseline;gap:10px;margin:10px 0 8px;}
  .hero-card .price{font-family:var(--font-bang);font-size:56px;line-height:.9;color:var(--gold);}
  .hero-card .was{font-size:14px;color:var(--page-muted);text-decoration:line-through;}
  .stock-bar{height:10px;background:#3a1820;border:1px solid #6a2830;margin:12px 0 8px;}
  .stock-bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--siren));width:40%;}
  .stock-meta{display:flex;justify-content:space-between;font-family:var(--font-type);font-size:12px;color:var(--accent-soft);}
  .odds{
    margin-top:14px;padding-top:12px;border-top:1px dashed rgba(255,196,77,0.3);
    font-size:13px;color:var(--hero-sub);
  }
  .odds b{color:var(--lime);}

  section{padding:56px 24px;}
  .section-head{max-width:720px;margin:0 auto 32px;text-align:center;}
  .section-head .kicker{
    font-family:var(--font-type);font-size:12px;letter-spacing:1.4px;
    color:var(--accent);display:block;margin-bottom:10px;
  }
  .section-head h2{font-family:var(--font-bang);font-size:clamp(32px,5vw,52px);letter-spacing:.02em;text-transform:uppercase;}
  .section-head p{margin-top:12px;color:var(--page-muted);font-size:15.5px;}

  .steps{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  @media(max-width:800px){.steps{grid-template-columns:1fr;}}
  .step-card{
    background:var(--surface);border:1px solid var(--rule);
    padding:22px 20px;
  }
  .step-num{
    font-family:var(--font-bang);font-size:22px;color:#1a0b10;
    background:var(--gold);width:36px;height:36px;
    display:flex;align-items:center;justify-content:center;margin-bottom:14px;
  }
  .step-card h3{font-size:18px;margin-bottom:8px;}
  .step-card p{font-size:14.5px;color:var(--page-muted);}

  .why-alt{background:var(--why-bg);color:var(--why-text);}
  .why-alt .section-head p{color:var(--why-muted);}
  .why-grid{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);}
  @media(max-width:800px){.why-grid{grid-template-columns:1fr;}}
  .why-item{background:var(--why-bg);padding:28px 24px;}
  .why-item h3{font-size:19px;margin-bottom:10px;}
  .why-item p{font-size:14.5px;color:var(--why-muted);}

  .grid-products{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}
  @media(max-width:760px){.grid-products{grid-template-columns:1fr;}}
  .slip{
    background:var(--card);
    border:1px solid var(--card-border);
    position:relative;
    padding:22px 20px 18px;
    display:flex;flex-direction:column;gap:8px;
    overflow:hidden;
  }
  .slip.flash{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);}
  .slip.daily{border-color:var(--siren);}
  .slip::before{display:none;}
  .slip-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .slip-tag{
    font-family:var(--font-type);font-size:10.5px;letter-spacing:.5px;
    background:var(--gold);color:#1a0b10;
    padding:3px 8px;font-weight:700;
  }
  .stamp{
    font-family:var(--font-bang);font-size:13px;color:var(--accent);
    border:2px solid var(--accent);padding:3px 7px;
    transform:rotate(-6deg);white-space:nowrap;
  }
  .slip h3{font-family:var(--font-bang);font-size:28px;line-height:.95;text-transform:uppercase;margin-top:4px;}
  .slip .varietal{font-size:13px;color:var(--page-muted);font-style:italic;}
  .slip p.desc{font-size:14px;color:var(--page-muted);margin-top:2px;}
  .slip-price-row{display:flex;align-items:baseline;gap:8px;margin-top:6px;}
  .price{font-family:var(--font-bang);font-size:36px;font-weight:400;letter-spacing:.02em;}
  .srp-range{font-size:12.5px;color:var(--page-muted);}
  .slip-actions{display:flex;gap:10px;margin-top:10px;}
  .left-chip{
    position:absolute;top:14px;right:14px;
    background:var(--siren);color:#fff;
    font-family:var(--font-type);font-size:11px;font-weight:700;
    padding:4px 7px;
  }

  .feed{
    max-width:1120px;margin:0 auto;
    display:grid;grid-template-columns:1.2fr .8fr;gap:18px;
  }
  @media(max-width:800px){.feed{grid-template-columns:1fr;}}
  .feed-list{display:flex;flex-direction:column;gap:8px;}
  .feed-row{
    background:var(--surface);border:1px solid var(--rule);
    padding:12px 14px;display:flex;justify-content:space-between;gap:12px;
    font-size:14px;
  }
  .feed-row .hit{color:var(--gold);font-family:var(--font-type);font-weight:700;white-space:nowrap;}
  .heat-card{
    background:#9a1020;color:#fff;padding:22px 20px;
  }
  .heat-card h3{font-family:var(--font-bang);font-size:32px;text-transform:uppercase;line-height:.95;}
  .heat-card p{margin-top:10px;opacity:.9;}
  .heat-num{font-family:var(--font-bang);font-size:64px;color:var(--gold);line-height:1;margin-top:12px;}

  .stamps-row{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  @media(max-width:800px){.stamps-row{grid-template-columns:1fr;}}
  .quote-card{background:var(--surface);border:1px solid var(--rule);padding:24px;}
  .quote-card p.q{font-size:15px;color:var(--page-text);}
  .quote-card .who{font-family:var(--font-type);font-size:12px;color:var(--accent);margin-top:14px;display:block;}

  .newsletter{background:var(--gold);color:#1a0b10;}
  .newsletter-inner{max-width:640px;margin:0 auto;text-align:center;}
  .newsletter h2{font-family:var(--font-bang);font-size:40px;text-transform:uppercase;}
  .newsletter p{margin-top:10px;font-size:14.5px;color:#4a2420;}
  .newsletter-form{display:flex;gap:10px;margin-top:22px;max-width:420px;margin-left:auto;margin-right:auto;}
  .newsletter-form input{
    flex:1;padding:12px 14px;border:1.5px solid #1a0b10;background:#fff;font-family:var(--font-body);font-size:14px;
  }
  .newsletter-msg{margin-top:14px;font-family:var(--font-type);font-size:13px;color:#4a2420;}

  footer.site{background:#080406;color:#c9a8a4;padding:50px 24px 30px;}
  .footer-grid{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:30px;}
  @media(max-width:760px){.footer-grid{grid-template-columns:1fr 1fr;}}
  .footer-grid h4{color:#f6ecd8;font-size:13px;letter-spacing:.5px;margin-bottom:14px;font-family:var(--font-type);}
  .footer-grid ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px;}
  .footer-grid a{font-size:14px;color:#c9a8a4;}
  .footer-grid a:hover{color:#fff;}
  .footer-brand{font-family:var(--font-chalk);font-size:26px;color:#f6ecd8;}
  .footer-blurb{margin-top:12px;font-size:13.5px;color:#c9a8a4;max-width:34ch;}
  .footer-bottom{
    max-width:1120px;margin:36px auto 0;padding-top:20px;
    border-top:1px solid #3a1820;
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;
    font-size:12.5px;
  }
  .social-row{display:flex;gap:14px;margin-top:16px;}

  .page-hero{background:var(--chrome);color:var(--chrome-text);padding:40px 24px 36px;}
  .page-hero .wrap{max-width:900px;}
  .page-hero .kicker{font-family:var(--font-type);font-size:12px;color:var(--gold);letter-spacing:1px;}
  [data-theme="light"] .page-hero .kicker{color:var(--accent);}
  .page-hero h1{font-family:var(--font-bang);font-size:clamp(36px,6vw,64px);margin-top:8px;text-transform:uppercase;line-height:.92;}
  .page-hero p{margin-top:14px;color:var(--hero-sub);max-width:60ch;font-size:15.5px;}

  .content-block{max-width:800px;margin:0 auto;padding:60px 24px;}
  .content-block h2{font-family:var(--font-bang);font-size:30px;margin-top:36px;margin-bottom:12px;text-transform:uppercase;}
  .content-block h2:first-child{margin-top:0;}
  .content-block p{color:var(--page-text);font-size:15.5px;margin-bottom:14px;}

  .faq-list{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:1px;background:var(--rule);}
  .faq-item{background:var(--page);}
  .faq-q{
    width:100%;text-align:left;background:none;border:none;
    padding:20px 4px;display:flex;justify-content:space-between;align-items:center;

  function addToCart(slug, qty){
    var existing = null;
    cart.forEach(function(i){ if(i.slug===slug) existing=i; });
    if (existing) existing.qty += qty;
    else cart.push({slug:slug, qty:qty});
    boughtExtra[slug] = (boughtExtra[slug]||0) + qty;
    renderCartCount();

  function weightedPick(pool){
    var total=0; pool.forEach(function(b){ total+=b.weight; });
    var r = Math.random()*total, acc=0;
    for (var i=0;i<pool.length;i++){
      acc+=pool[i].weight;
      if (r<=acc) return pool[i];
    }
    return pool[0];
  }

    '<div class="content-block"><p>'+body+'</p></div>';

  function pageCart(){
    if (cart.length===0){
      return '<div class="cart-page"><div class="empty-state">' +
        '<h2>'+t("emptyH")+'</h2>' +
        '<p>'+t("emptyP")+'</p>' +
        '<a class="btn btn-primary" href="#/collections">'+t("browse")+'</a>' +
      '</div></div>';
    }
    var rows = cart.map(function(item){
      var p = locProduct(findProduct(item.slug));
      return '<div class="cart-item">' +
        '<div><h4>'+p.name+'</h4><span class="meta">'+money(p.price)+' &times; '+item.qty+'</span></div>' +
        '<div class="qty-control">' +
          '<button data-dec="'+p.slug+'" aria-label="-">&minus;</button>' +
          '<span>'+item.qty+'</span>' +
          '<button data-inc="'+p.slug+'" aria-label="+">+</button>' +
        '</div>' +
        '<div style="font-family:var(--font-type);">'+money(p.price*item.qty)+'</div>' +
        '<button class="remove-link" data-remove="'+p.slug+'">Remove</button>' +
      '</div>';
    }).join("");
    var total = cartTotal();
    return '' +
    '<div class="cart-page">' +
      '<h1 style="font-family:var(--font-chalk);font-size:38px;margin-bottom:20px;">'+t("hallTitle")+'</h1>' +
      rows +
      '<div class="cart-summary">' +
        '<div class="summary-row"><span>'+t("subtotal")+'</span><span>'+money(total)+'</span></div>' +
        '<div class="summary-row"><span>'+t("shipping")+'</span><span>'+t("shipDemo")+'</span></div>' +
        '<div class="summary-row total"><span>'+t("total")+'</span><span>'+money(total)+'</span></div>' +
      '</div>' +
      '<div style="display:flex;gap:12px;margin-top:22px;">' +
        '<a class="btn btn-dark" href="#/collections" style="flex:1;text-align:center;">'+t("keep")+'</a>' +
        '<a class="btn btn-primary" href="#/checkout" style="flex:1;text-align:center;">'+t("checkout")+'</a>' +
      '</div>' +
    '</div>';
  }

  function pageCheckout(){
    if (cart.length===0){
      return '<div class="checkout-page"><div class="empty-state"><h2>'+t("nothingH")+'</h2><p>'+t("nothingP")+'</p><a class="btn btn-primary" href="#/collections">'+t("browse")+'</a></div></div>';
    }
    var total = cartTotal();
    return '' +
    '<div class="checkout-page">' +
      '<h1 style="font-family:var(--font-chalk);font-size:38px;margin-bottom:6px;">'+t("checkoutH")+'</h1>' +
      '<div class="demo-note">'+t("demoNote")+'</div>' +
      '<form id="checkout-form">' +
        '<div class="form-grid2">' +
          '<div class="form-row"><label for="ch-first">'+t("first")+'</label><input id="ch-first" required></div>' +
          '<div class="form-row"><label for="ch-last">'+t("last")+'</label><input id="ch-last" required></div>' +
        '</div>' +
        '<div class="form-row"><label for="ch-email">'+t("email")+'</label><input id="ch-email" type="email" required></div>' +
        '<div class="form-row"><label for="ch-address">'+t("address")+'</label><input id="ch-address" required></div>' +
        '<div class="form-grid2">' +
          '<div class="form-row"><label for="ch-city">'+t("city")+'</label><input id="ch-city" required></div>' +
          '<div class="form-row"><label for="ch-zip">'+t("zip")+'</label><input id="ch-zip" required></div>' +
        '</div>' +
        '<div class="form-row"><label for="ch-card">'+t("card")+'</label><input id="ch-card" placeholder="4242 4242 4242 4242" required></div>' +
        '<div class="checkout-summary"><strong>'+t("orderTotal")+' '+money(total)+'</strong></div>' +
        '<button class="btn btn-primary btn-block" type="submit" style="margin-top:20px;">'+t("complete")+'</button>' +
      '</form>' +
    '</div>';
  }

  function pageConfirmation(){
    if (!lastOrder){
      return '<div class="content-block"><h2>'+t("noOrder")+'</h2><p>'+t("noOrderP")+' <a href="#/collections">'+t("browse")+'</a>.</p></div>';
    }
    var groups = lastOrder.groups.map(function(g){
      var bottles = g.bottles.map(function(b){
        var isUpgrade = b.value > g.pricePerBottle;
        return '<div class="bottle-card'+(isUpgrade ? ' upgrade':'')+'">' +
          (isUpgrade ? '<span class="upgrade-flag">'+t("upgrade")+'</span>' : '') +
          bottleIconSVG() +
          '<h4>'+b.name+'</h4>' +
          '<div class="val">'+money(b.value)+'</div>' +
        '</div>';
      }).join("");
      return '<div class="reveal-group"><h3>'+g.name+'</h3><div class="reveal-bottles">'+bottles+'</div></div>';
    }).join("");
    return '' +
    '<div class="reveal-page">' +
      '<div class="reveal-head">' +
        '<span class="order-no">ORDER '+lastOrder.orderId+'</span>' +
        '<h1>'+t("revealH")+'</h1>' +
      '</div>' +
      '<div class="reveal-value-banner">' +
        '<div>'+t("youPaid")+' <strong>'+money(lastOrder.paid)+'</strong></div>' +
        '<div class="big">'+t("youGot")+' '+money(lastOrder.value)+' '+t("retail")+'</div>' +
      '</div>' +
      groups +
      '<div style="text-align:center;margin-top:30px;">' +
        '<a class="btn btn-primary" href="#/collections">'+t("another")+'</a>' +
      '</div>' +
    '</div>';
  }

  function render(){
    var route = currentRoute();
    var html = "";
    if (route === "/" ) html = pageHome();
    else if (route === "/collections") html = pageCollections();
    else if (route.indexOf("/product/") === 0) html = pageProduct(route.replace("/product/",""));
    else if (route === "/how-it-works") html = pageHowItWorks();
    else if (route === "/about") html = pageAbout();
    else if (route === "/faq") html = pageFAQ();
    else if (route === "/contact") html = pageContact();
    else if (route === "/policy/privacy") html = pagePolicy("privacy");
    else if (route === "/policy/terms") html = pagePolicy("terms");
    else if (route === "/cart") html = pageCart();
    else if (route === "/checkout") html = pageCheckout();
    else if (route === "/confirmation") html = pageConfirmation();
    else html = '<div class="content-block"><h2>'+t("page404")+'</h2><p><a href="#/">'+t("backHome")+'</a></p></div>';
    document.getElementById("app").innerHTML = html;
    renderCartCount();
    highlightNav(route);
    bindPageEvents(route);
    document.getElementById("nav-links").classList.remove("open");
  }

  function highlightNav(route){
    document.querySelectorAll("nav.links a[data-route]").forEach(function(a){
      var r = a.getAttribute("data-route");
      a.classList.toggle("active", r===route || (r==="/collections" && route.indexOf("/product/")===0));
    });
  }

  function bindPageEvents(route){
    document.querySelectorAll("[data-add]").forEach(function(btn){
      btn.addEventListener("click", function(){ addToCart(btn.getAttribute("data-add"), 1); });
    });
    if (route.indexOf("/product/") === 0){
      var slug = route.replace("/product/","");
      var qty = 1;
      var qtyVal = document.getElementById("qty-val");
      document.getElementById("qty-minus").addEventListener("click", function(){
        qty = Math.max(1, qty-1); qtyVal.textContent = qty;
      });
      document.getElementById("qty-plus").addEventListener("click", function(){
        qty = qty+1; qtyVal.textContent = qty;
      });
      document.getElementById("pd-add").addEventListener("click", function(){ addToCart(slug, qty); });
    }
    if (route === "/faq"){
      document.querySelectorAll(".faq-item").forEach(function(item){
        item.querySelector(".faq-q").addEventListener("click", function(){ item.classList.toggle("open"); });
      });
    }
    if (route === "/cart"){
      document.querySelectorAll("[data-remove]").forEach(function(btn){
        btn.addEventListener("click", function(){ removeFromCart(btn.getAttribute("data-remove")); });
      });
      document.querySelectorAll("[data-inc]").forEach(function(btn){
        btn.addEventListener("click", function(){
          var s = btn.getAttribute("data-inc");
          var item = cart.find(function(i){return i.slug===s;});
          setQty(s, item.qty+1);
        });
      });
      document.querySelectorAll("[data-dec]").forEach(function(btn){
        btn.addEventListener("click", function(){
          var s = btn.getAttribute("data-dec");
          var item = cart.find(function(i){return i.slug===s;});
          setQty(s, item.qty-1);
        });
      });
    }
    if (route === "/checkout"){
      var form = document.getElementById("checkout-form");
      if (form) form.addEventListener("submit", function(e){ e.preventDefault(); processOrder(); });
    }
    if (route === "/contact"){
      var cform = document.getElementById("contact-form");
      cform.addEventListener("submit", function(e){
        e.preventDefault();
        document.getElementById("contact-msg").textContent = t("contactOk");
        cform.reset();
      });
    }
    if (route === "/"){
      var nform = document.getElementById("newsletter-form");
      if (nform){
        nform.addEventListener("submit", function(e){
          e.preventDefault();
          document.getElementById("newsletter-msg").textContent = t("newsOk");
          nform.reset();
        });
      }
    }
  }

  function processOrder(){
    var groups = cart.map(function(item){
      var p = locProduct(findProduct(item.slug));
      var bottles = [];
      for (var u=0; u<item.qty; u++){
        for (var b=0; b<3; b++){ bottles.push(weightedPick(p.pool)); }
      }
      return { name: p.name + " ×" + item.qty, pricePerBottle: p.price / 3, bottles: bottles };
    });
    var value = 0;
    groups.forEach(function(g){ g.bottles.forEach(function(b){ value += b.value; }); });
    lastOrder = {
      orderId: "WD-" + Math.floor(100000 + Math.random()*899999),
      paid: cartTotal(),
      value: value,
      groups: groups
    };
    cart = [];
    renderCartCount();
    navigate("/confirmation");
  }

  function persist(){
    try {
      localStorage.setItem("wd-theme", theme);
      localStorage.setItem("wd-lang", lang);
    } catch (e) {}
  }

  function loadPrefs(){
    try {
      var savedTheme = localStorage.getItem("wd-theme");
      var savedLang = localStorage.getItem("wd-lang");
      if (savedTheme === "light" || savedTheme === "dark") theme = savedTheme;
      if (savedLang && STR[savedLang]) lang = savedLang;
    } catch (e) {}
  }

  document.getElementById("menu-toggle").addEventListener("click", function(){
    document.getElementById("nav-links").classList.toggle("open");
  });
  document.getElementById("theme-toggle").addEventListener("click", function(){
    theme = theme === "dark" ? "light" : "dark";
    persist();
    applyPrefs();
    render();
  });
  document.getElementById("lang-select").addEventListener("change", function(){
    lang = this.value;
    persist();
    applyPrefs();
    render();
  });

  LANGS.forEach(function(item){
    var opt = document.createElement("option");
    opt.value = item.code;
    opt.textContent = item.label;
    document.getElementById("lang-select").appendChild(opt);
  });

  function updateLiveChrome(){
    var clock = document.getElementById("day-clock");
    if (clock) clock.textContent = formatRemain(endOfDay() - Date.now());
    var w = document.getElementById("watchers");
    if (w) w.textContent = watchersNow().toLocaleString() + " watching";
    document.querySelectorAll("[data-countdown='day']").forEach(function(el){
      el.textContent = formatRemain(endOfDay() - Date.now());
    });
  }

  loadPrefs();
  applyPrefs();
  var ticker = document.getElementById("ticker-track");
  if (ticker) ticker.innerHTML = tickerHTML();
  if (gateShown) document.getElementById("age-gate").classList.add("hidden");
  render();
  updateLiveChrome();
  setInterval(updateLiveChrome, 1000);
})();
</script>
</body>
</html>
